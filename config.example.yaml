interval: 30s

rules:
  - name: documents
    directory: ~/Outbox/documents
    patterns:
      - "*.pdf"
      - "*.jpg"
      - "*.png"
    minimum_age: 10s
    command: |
      curl --fail-with-body \
        --retry 3 \
        -H "Authorization: Bearer $UPLOAD_TOKEN" \
        -F "file=@$FILE" \
        "https://example.com/api/documents"
    on_success: delete

  - name: bank-csv
    directory: ~/Outbox/bank
    patterns:
      - "*.csv"
    minimum_age: 10s
    command: |
      curl --fail-with-body \
        --retry 3 \
        -H "X-API-Key: $BANK_API_KEY" \
        -F "source=example-bank" \
        -F "file=@$FILE" \
        "https://example.com/api/import/csv"
    on_success: archive
    archive_directory: ~/Outbox/archive/bank
